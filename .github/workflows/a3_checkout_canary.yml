name: A3 Host Checkout Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-host-checkout-canary
  cancel-in-progress: false

jobs:
  host-checkout-canary:
    runs-on: tilelang-a3-host-canary

    timeout-minutes: 20

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify host runner configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "user=$(whoami)"
          echo "arch=$(uname -m)"
          echo "workspace=${GITHUB_WORKSPACE}"
          test "${RUNNER_NAME}" = "tilelang-a3-host-canary-fzh"
          test "$(whoami)" = "gha-fzh"
          test "$(uname -m)" = "aarch64"
          case "${GITHUB_WORKSPACE}" in
            /data/workspace/fzh/actions-runner-host-canary/_work/*) ;;
            *) echo "unexpected workspace: ${GITHUB_WORKSPACE}"; exit 1 ;;
          esac
          test "$(sudo -n /usr/local/sbin/tl_fzh-docker-exec status)" = "running"

      - name: Run in-container probe (NPU + TileLang + GEMM)
        shell: bash
        run: |
          set -euo pipefail
          cat > "${GITHUB_WORKSPACE}/host_probe.sh" <<'PROBE'
          #!/bin/bash
          set -euo pipefail

          STABLE_REPO=/workspace/fzh/tilelang-ascend
          export STABLE_REPO

          test -f "${STABLE_REPO}/set_env.sh"
          test -f "${STABLE_REPO}/3rdparty/tvm/python/tvm/__init__.py"
          test -f "${STABLE_REPO}/build/tvm/libtvm.so"

          source /usr/local/Ascend/cann-9.1.0-beta.1/set_env.sh
          source /workspace/fzh/venvs/tilelang-a3-py312/bin/activate

          cd "${STABLE_REPO}"
          source "${STABLE_REPO}/set_env.sh"
          export ACL_OP_INIT_MODE=1

          echo "id=$(id -u):$(id -g) uname=$(id -un) gname=$(id -gn)"
          echo "HOME=$HOME USER=$USER LOGNAME=$LOGNAME TMPDIR=$TMPDIR"
          echo "ASCEND_RT_VISIBLE_DEVICES=${ASCEND_RT_VISIBLE_DEVICES:-<unset>}"
          echo "STABLE_REPO=${STABLE_REPO}"

          python3 - <<'PY'
          import os
          import torch
          import torch_npu
          import tilelang
          import tvm

          stable = os.path.realpath(os.environ["STABLE_REPO"])
          tilelang_path = os.path.realpath(tilelang.__file__)
          tvm_path = os.path.realpath(tvm.__file__)

          assert os.environ.get("ASCEND_RT_VISIBLE_DEVICES") == "0"
          assert torch.npu.is_available() is True
          assert torch.npu.device_count() == 1

          torch.npu.set_device(0)
          x = torch.arange(8, dtype=torch.float32).npu()
          print("tensor_result", (x + 1).cpu().tolist())
          print("tilelang", tilelang_path)
          print("tvm", tvm_path)
          print("torch_npu", torch_npu.__version__)

          assert tilelang_path.startswith(stable + os.sep), "tilelang NOT from STABLE_REPO"
          assert tvm_path.startswith(stable + os.sep), "tvm NOT from STABLE_REPO"
          print("IMPORT_OK")
          PY

          # GEMM 从 STABLE_REPO 示例执行，在可写 TMPDIR 下运行以避免污染 root 所有的稳定仓库
          cd "${TMPDIR}"
          python3 "${STABLE_REPO}/examples/gemm/example_gemm.py" --m 512 --n 512 --k 512

          echo "PROBE_OK"
          PROBE
          chmod +x "${GITHUB_WORKSPACE}/host_probe.sh"
          sudo -n /usr/local/sbin/tl_fzh-docker-exec run "${GITHUB_WORKSPACE}" host_probe.sh

      - name: Cleanup probe
        if: always()
        shell: bash
        run: |
          rm -f "${GITHUB_WORKSPACE}/host_probe.sh"
          rm -rf "${GITHUB_WORKSPACE}/.pkl_memoize_py3"
