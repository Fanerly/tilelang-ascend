name: A3 Host Full Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-host-full-canary
  cancel-in-progress: false

jobs:
  host-full-canary:
    runs-on: tilelang-a3-host-canary

    timeout-minutes: 240

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        validation_run: [1, 2]

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify host runner configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "user=$(whoami)"
          echo "arch=$(uname -m)"
          echo "workspace=${GITHUB_WORKSPACE}"
          test "${RUNNER_NAME}" = "tilelang-a3-host-canary-fzh"
          test "$(whoami)" = "gha-fzh"
          test "$(uname -m)" = "aarch64"
          case "${GITHUB_WORKSPACE}" in
            /data/workspace/fzh/actions-runner-host-canary/_work/*) ;;
            *) echo "unexpected workspace: ${GITHUB_WORKSPACE}"; exit 1 ;;
          esac
          test "$(sudo -n /usr/local/sbin/tl_fzh-docker-exec status)" = "running"

      - name: Run full canary in container (submodule + build + bench + pytest + tail + operator)
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/tl_fzh-docker-exec run \
            "${GITHUB_WORKSPACE}" a3_host_full_canary.sh

      - name: Upload canary logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-host-full-canary-run${{ matrix.validation_run }}-${{ github.run_id }}
          path: |
            a3_host_*.log
          if-no-files-found: warn
          retention-days: 7
