name: A3 Stage1 Candidate Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-stage1-candidate
  cancel-in-progress: false

jobs:
  a3-candidate:
    runs-on: tilelang-a3-host-canary

    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify A3 host runner configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "mode=${CI_EXECUTION_MODE:-legacy}"
          echo "wrapper=${CI_EXEC_WRAPPER:-unset}"
          echo "logical_device=${CI_LOGICAL_DEVICE:-unset}"
          echo "cache_namespace=${CI_CACHE_NAMESPACE:-unset}"
          echo "arch=$(uname -m)"
          echo "user=$(whoami)"
          test "${RUNNER_NAME}" = "tilelang-a3-host-canary-fzh"
          test "$(whoami)" = "gha-fzh"
          test "$(uname -m)" = "aarch64"
          test "${CI_EXECUTION_MODE:-}" = "host-wrapper"
          test -n "${CI_EXEC_WRAPPER:-}"

      - name: Run A3 candidate (host-wrapper)
        shell: bash
        run: |
          set -euo pipefail
          cat > "${GITHUB_WORKSPACE}/a3_host_run_ctx.env" <<EOF
          RUN_ID=${GITHUB_RUN_ID}
          JOB=${GITHUB_JOB}
          VALIDATION_RUN=1
          EOF
          bash scripts/ci/ci_exec_adapter.sh "${GITHUB_WORKSPACE}/a3_host_full_canary.sh"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-stage1-candidate-${{ github.run_id }}
          path: |
            a3_host_*.log
          if-no-files-found: warn
          retention-days: 7
