name: A3 Host Checkout Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-host-checkout-canary
  cancel-in-progress: false

jobs:
  host-checkout-canary:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - tilelang-a3-host-canary

    timeout-minutes: 20

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify host runner configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "user=$(whoami)"
          echo "arch=$(uname -m)"
          echo "workspace=${GITHUB_WORKSPACE}"
          test "${RUNNER_NAME}" = "tilelang-a3-host-canary-fzh"
          test "$(whoami)" = "gha-fzh"
          test "$(uname -m)" = "aarch64"
          case "${GITHUB_WORKSPACE}" in
            /data/workspace/fzh/actions-runner-host-canary/_work/*) ;;
            *) echo "unexpected workspace: ${GITHUB_WORKSPACE}"; exit 1 ;;
          esac
          test "$(sudo -n /usr/local/sbin/tl_fzh-docker-exec status)" = "running"

      - name: Run in-container probe (NPU + TileLang + GEMM)
        shell: bash
        run: |
          set -euo pipefail
          cat > "${GITHUB_WORKSPACE}/host_probe.sh" <<'PROBE'
          #!/bin/bash
          set -euo pipefail
          source /usr/local/Ascend/cann-9.1.0-beta.1/set_env.sh
          source /workspace/fzh/venvs/tilelang-a3-py312/bin/activate
          export PYTHONPATH="/workspace/fzh/tilelang-ascend${PYTHONPATH:+:$PYTHONPATH}"
          export ACL_OP_INIT_MODE=1
          echo "id=$(id -u):$(id -g) uname=$(id -un) gname=$(id -gn)"
          echo "HOME=$HOME USER=$USER LOGNAME=$LOGNAME TMPDIR=$TMPDIR"
          echo "ASCEND_RT_VISIBLE_DEVICES=${ASCEND_RT_VISIBLE_DEVICES:-<unset>}"
          python3 - <<'PY'
          import os
          import torch
          import torch_npu
          import tilelang
          assert os.environ.get("ASCEND_RT_VISIBLE_DEVICES") == "0"
          assert torch.npu.is_available() is True
          assert torch.npu.device_count() == 1
          torch.npu.set_device(0)
          x = torch.arange(8, dtype=torch.float32).npu()
          print("tensor_result", (x + 1).cpu().tolist())
          print("tilelang", tilelang.__file__)
          print("torch_npu", torch_npu.__version__)
          PY
          python3 /workspace/fzh/tilelang-ascend/examples/gemm/example_gemm.py --m 512 --n 512 --k 512
          echo "PROBE_OK"
          PROBE
          chmod +x "${GITHUB_WORKSPACE}/host_probe.sh"
          sudo -n /usr/local/sbin/tl_fzh-docker-exec run "${GITHUB_WORKSPACE}" host_probe.sh

      - name: Cleanup probe
        if: always()
        shell: bash
        run: |
          rm -f "${GITHUB_WORKSPACE}/host_probe.sh"
          rm -rf "${GITHUB_WORKSPACE}/.pkl_memoize_py3"
